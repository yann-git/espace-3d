12073, -13543927, -984260], [4394919, -13514090, -978923], [4477584, -13483702, -973547], [4560066, -13452762, -968131], [4642362, -13421272, -962676], [4724467, -13389233, -957181], [4806379, -13356646, -951647], [4888093, -13323510, -946074], [4969608, -13289829, -940462], [5050918, -13255602, -934811], [5132020, -13220830, -929122], [5212912, -13185514, -923395], [5293590, -13149656, -917630], [5374050, -13113256, -911827], [5454289, -13076315, -905987], [5534303, -13038835, -900109], [5614089, -13000817, -894194], [5693644, -12962261, -888242], [5772964, -12923169, -882253], [5852046, -12883541, -876228], [5930886, -12843380, -870166], [6009481, -12802687, -864069], [6087828, -12761461, -857935], [6165922, -12719706, -851766], [6243761, -12677421, -845562], [6321342, -12634608, -839322], [6398660, -12591270, -833048], [6475713, -12547406, -826738], [6552496, -12503018, -820394], [6629008, -12458107, -814016], [6705244, -12412676, -807604], [6781200, -12366725, -801158], [6856874, -12320255, -794679]]}], "marks": [{"nom": "Artemis I (Orion)", "couleur": "#ef5350", "date": "2022-11-28 20:49", "dist_terre_km": 438584, "xyz": [10524922, -11418058, -1424903], "lune_xyz": [8946301, -9460642, -1193118]}, {"nom": "Artemis II (Orion « Integrity »)", "couleur": "#ffca28", "date": "2026-04-06 23:10", "dist_terre_km": 413142, "xyz": [-4696945, -13857634, -1298432], "lune_xyz": [-4621485, -13572292, -1292307]}]}}, TEX = {"Soleil": "https://upload.wikimedia.org/wikipedia/commons/c/cb/Solarsystemscope_texture_2k_sun.jpg", "Mercure": "https://upload.wikimedia.org/wikipedia/commons/9/92/Solarsystemscope_texture_2k_mercury.jpg", "Vénus": "https://upload.wikimedia.org/wikipedia/commons/6/63/Solarsystemscope_texture_2k_venus_atmosphere.jpg", "Terre": "https://upload.wikimedia.org/wikipedia/commons/c/c3/Solarsystemscope_texture_2k_earth_daymap.jpg", "Mars": "https://upload.wikimedia.org/wikipedia/commons/4/46/Solarsystemscope_texture_2k_mars.jpg", "Jupiter": "https://upload.wikimedi require(["esri/Map", "esri/views/SceneView", "esri/layers/GraphicsLayer", "esri/Graphic", "esri/geometry/Point",
         "esri/geometry/Polyline", "esri/geometry/Mesh", "esri/geometry/support/MeshMaterialMetallicRoughness"],
(Map, SceneView, GraphicsLayer, Graphic, Point, Polyline, Mesh, MeshMaterialMR) => {
  const SR = { wkid: 3857 };
  const layer = new GraphicsLayer({ elevationInfo: { mode: "absolute-height" } });
  const map = new Map({ layers: [layer], ground: { opacity: 0, navigationConstraint: { type: "none" } } });
  const view = new SceneView({
    container: "view", map, viewingMode: "local", spatialReference: SR,
    environment: { background: { type: "color", color: [0, 0, 0, 1] }, starsEnabled: false, atmosphereEnabled: false,
                   lighting: { type: "virtual" } },
    constraints: { collision: { enabled: false } }, qualityProfile: "high",
    popup: { dockEnabled: true, dockOptions: { position: "top-right", breakpoint: false } },
  });

  const P = (xyz) => new Point({ x: xyz[0], y: xyz[1], z: xyz[2] || 0, spatialReference: SR });
  const hex = (h, a = 1) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16), a];

  function sphere(name, xyz, diameter, fallback, emissive) {
    const url = TEX[name];
    const material = url
      ? new MeshMaterialMR(emissive ? { colorTexture: url, emissiveTexture: url, emissiveColor: "white", metallic: 0, roughness: 1 }
                                    : { colorTexture: url, metallic: 0, roughness: 0.9 })
      : new MeshMaterialMR({ color: fallback, metallic: 0, roughness: 0.9 });
    const mesh = Mesh.createSphere(P(xyz), { size: diameter, densificationFactor: 3, material, vertexSpace: "georeferenced" });
    return new Graphic({ geometry: mesh,
      symbol: { type: "mesh-3d", symbolLayers: [{ type: "fill", material: { color: "white" } }] } });
  }
  function label(xyz, text, colour, attrs, icon = true, offset = 1) {
    const layers = [];
    if (icon) layers.push({ type: "icon", size: 7, resource: { primitive: "circle" }, material: { color: colour },
                            outline: { color: [0, 0, 0, 1], size: 0.5 } });
    layers.push({ type: "text", text, size: 10, material: { color: [235, 235, 235, 1] },
                  halo: { color: [0, 0, 0, 1], size: 1 } });
    return new Graphic({ geometry: P(xyz), attributes: attrs, popupTemplate: attrs ? popupTpl : null,
      symbol: { type: "point-3d", symbolLayers: layers,
        verticalOffset: { screenLength: 18 * offset, maxWorldLength: 5e6, minWorldLength: 0 },
        callout: { type: "line", size: 0.5, color: [150, 150, 150, 1] } } });
  }
  function path(xyz, colour, width = 1.6, alpha = 0.9, dash = false) {
    return new Graphic({ geometry: new Polyline({ paths: [xyz], hasZ: true, spatialReference: SR }),
      symbol: { type: "line-3d", symbolLayers: [{ type: "line", size: width, material: { color: hex(colour, alpha) },
        ...(dash ? { pattern: { type: "style", style: "dash" } } : {}) }] } });
  }
  const popupTpl = { title: "{nom}", content: (e) => {
    const a = e.graphic.attributes, rows = [];
    if (a.date) rows.push("Date : " + a.date);
    if (a.dist_soleil_ua) rows.push(a.dist_soleil_ua + " UA du Soleil (" + a.dist_soleil_mkm + " millions de km)");
    if (a.temps_lumiere_h) rows.push("Temps-lumière : " + a.temps_lumiere_h + " h");
    if (a.dist_terre_km) rows.push(a.dist_terre_km.toLocaleString("fr") + " km de la Terre");
    if (a.description) rows.push("<i>" + a.description + "</i>");
    return rows.join("<br>"); } };

  // Log radial scale, identical to build_space_layers.py
  const d = (au) => Math.log10(1 + au / 0.2) * 6e6;

  function buildHelio() {
    const g = [];
    [[1, "1 UA"], [5.2, "5 UA"], [30, "30 UA"], [121, "121 UA · héliopause"]].forEach(([au, t]) => {
      const r = d(au), ring = [];
      for (let a = 0; a <= 360; a += 3) ring.push([r * Math.cos(a * Math.PI / 180), r * Math.sin(a * Math.PI / 180), 0]);
      g.push(path(ring, "#555555", 0.8, 0.7, true), label([r * 0.707, -r * 0.707, 0], t, [0, 0, 0, 0], null, false, 0));
    });
    DATA.helio.orbits.forEach(o => g.push(path(o.xyz, o.couleur, 1, 0.55)));
    DATA.helio.tracks.forEach(t => g.push(path(t.xyz, t.couleur, 1.8, 0.95)));
    g.push(sphere("Soleil", [0, 0, 0], SIZES["Soleil"], "#ffd54f", true),
           label([0, 0, 0], "Soleil", "#ffd54f", { nom: "Soleil", description: "Centre du repère. Distances en échelle logarithmique." }, false, 3));
    DATA.helio.bodies.forEach(b => {
      if (b.type === "planète") {
        g.push(sphere(b.nom, b.xyz, SIZES[b.nom] || 120e3, b.couleur, false));
        g.push(label(b.xyz, b.nom, b.couleur, b, false, 1.6));
        if (b.nom === "Saturne") g.push(ringOf(b.xyz, SIZES[b.nom]));
      } else g.push(label(b.xyz, b.nom, b.couleur, b, true, 1));
    });
    return g;
  }
  function ringOf(xyz, size) {  // simple flat ring for Saturn
    const outer = size * 1.15, inner = size * 0.7, n = 64, pos = [], faces = [];
    for (let i = 0; i <= n; i++) {
      const a = 2 * Math.PI * i / n;
      pos.push(xyz[0] + inner * Math.cos(a), xyz[1] + inner * Math.sin(a), xyz[2],
               xyz[0] + outer * Math.cos(a), xyz[1] + outer * Math.sin(a), xyz[2]);
      if (i < n) { const k = 2 * i; faces.push(k, k + 1, k + 3, k, k + 3, k + 2); }
    }
    const mesh = new Mesh({ vertexAttributes: { position: pos }, spatialReference: SR,
      components: [{ faces, material: { color: [215, 195, 150, 0.55], doubleSided: true } }] });
    return new Graphic({ geometry: mesh, symbol: { type: "mesh-3d", symbolLayers: [{ type: "fill" }] } });
  }

  function buildGeo() {
    const g = [], EX = 3;  // Earth / Moon diameters exaggerated x3 (true scale: Earth ~450 km here)
    DATA.geo.moon.forEach(m => g.push(path(m.xyz, "#bdbdbd", 1, 0.5, true)));
    DATA.geo.tracks.forEach(t => g.push(path(t.xyz, t.couleur, 2, 0.95)));
    g.push(sphere("Terre", [0, 0, 0], 2 * 6371 * 35.56 * EX, "#4f9dff"),
           label([0, 0, 0], "Terre", "#4f9dff", { nom: "Terre" }, false, 2.5));
    DATA.geo.marks.forEach(m => {
      g.push(sphere("Lune", m.lune_xyz, 2 * 1737 * 35.56 * EX, "#bdbdbd"),
             label(m.lune_xyz, "Lune (" + m.nom.split(" (")[0] + ")", "#bdbdbd", null, false, 1.6),
             label(m.xyz, m.nom + " · point le plus lointain", m.couleur,
                   { nom: m.nom, date: m.date, dist_terre_km: m.dist_terre_km }, true, 1));
    });
    return g;
  }

  const NOTES = {
    helio: "Plan de l'écliptique en 3D, positions au 26/09/2026. Les trajectoires gardent leur vraie hauteur au-dessus ou " +
           "au-dessous de l'écliptique : Voyager 1 part vers le nord, Voyager 2 plonge vers le sud après Neptune. " +
           "Distances au Soleil en échelle logarithmique ; tailles des planètes non à l'échelle.",
    geo: "Repère centré sur la Terre, échelle linéaire. Orion d'Artemis I (2022, inhabité) et d'Artemis II (avril 2026, " +
         "4 astronautes). La Lune est placée à la date du point le plus lointain de chaque mission. Terre et Lune grossies ×3.",
  };
  let current = null;
  function show(v) {
    current = v;
    layer.removeAll(); layer.addMany(v === "helio" ? buildHelio() : buildGeo());
    document.querySelectorAll("#bar button[data-v]").forEach(b => b.classList.toggle("on", b.dataset.v === v));
    document.getElementById("note").textContent = NOTES[v];
    const R = v === "helio" ? 2.6e7 : 2.8e7;
    view.goTo({ position: { x: 0, y: -R * 1.3, z: R * 0.9, spatialReference: SR }, tilt: 55, heading: 0 },
              { duration: 1500 }).catch(() => {});
  }
  document.querySelectorAll("#bar button[data-v]").forEach(b => b.onclick = () => show(b.dataset.v));

  let spinning = false;
  document.getElementById("spin").onclick = (e) => { spinning = !spinning; e.target.classList.toggle("on", spinning); if (spinning) spin(); };
  function spin() {
    if (!spinning) return;
    // orbit the camera around the scene centre (Sun or Earth at 0,0)
    const cam = view.camera.clone(), a = 0.15 * Math.PI / 180, p = cam.position;
    cam.position = { x: p.x * Math.cos(a) - p.y * Math.sin(a), y: p.x * Math.sin(a) + p.y * Math.cos(a), z: p.z,
                     spatialReference: SR };
    cam.heading = (cam.heading - 0.15 + 360) % 360;
    view.goTo(cam, { animate: false }).then(() => requestAnimationFrame(spin)).catch(() => requestAnimationFrame(spin));
  }
  view.when(() => show("helio"));
  window.__view = view;
});
