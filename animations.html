<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missions en mouvement</title>
<meta name="description" content="Animations 3D de missions spatiales d'après les éphémérides du JPL (NASA) : Apollo 11, Voyager, comète de Halley, Artemis, la Lune et les planètes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@300;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.31/"></script>
<style>
  :root {
    --void: #070b14;        /* deep blue-black of the scene */
    --hull: #0e1526;        /* panels */
    --hull-line: #1d2944;
    --starlight: #e8edf7;   /* primary text */
    --dust: #8391ad;        /* secondary text */
    --sodium: #f2b544;      /* objects, events, selection */
    --chrono: #6fd3e6;      /* time: timeline, date */
    --sans: "Barlow", "Segoe UI", system-ui, sans-serif;
    --cond: "Barlow Condensed", "Arial Narrow", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--starlight); font-family: var(--sans); }
  body { overflow: hidden; }
  #scene { position: fixed; inset: 0; }
  .esri-view .esri-view-surface--inset-outline:focus::after { outline: none; }

  /* Mission log: chronological list on the left */
  #log { position: fixed; top: 20px; left: 20px; width: 250px; z-index: 5; }
  #log h1 { font-family: var(--cond); font-weight: 300; font-size: 30px; line-height: 1; margin: 0 0 14px;
            letter-spacing: .01em; }
  #log ol { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--hull-line); }
  #log li button { all: unset; cursor: pointer; display: grid; grid-template-columns: 46px 1fr; align-items: baseline;
                   width: 100%; padding: 7px 0 7px 12px; margin-left: -1px; border-left: 2px solid transparent;
                   color: var(--dust); font-size: 15px; }
  #log li button .y { font-family: var(--cond); font-size: 15px; color: var(--dust); }
  #log li button:hover { color: var(--starlight); }
  #log li button[aria-current="true"] { color: var(--starlight); border-left-color: var(--sodium); }
  #log li button[aria-current="true"] .y { color: var(--sodium); }
  #log li button:focus-visible { outline: 2px solid var(--chrono); outline-offset: 2px; }

  /* Story card */
  #card { position: fixed; top: 20px; right: 20px; width: 330px; z-index: 5; background: rgba(14, 21, 38, .82);
          border: 1px solid var(--hull-line); border-radius: 6px; padding: 16px 18px; backdrop-filter: blur(6px); }
  #card h2 { font-family: var(--cond); font-weight: 500; font-size: 26px; margin: 0 0 6px; }
  #card p { margin: 0; font-size: 14px; line-height: 1.55; color: #c9d1e3; }
  .cam { display: flex; gap: 6px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--hull-line); border-radius: 4px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 6px 11px; font-size: 13px; color: var(--dust); }
  .seg button[aria-pressed="true"] { background: var(--sodium); color: #1b1405; font-weight: 600; }
  .seg button:focus-visible, select:focus-visible, input:focus-visible, .ctl:focus-visible { outline: 2px solid var(--chrono); outline-offset: 1px; }
  select { background: var(--hull); color: var(--starlight); border: 1px solid var(--hull-line); border-radius: 4px;
           padding: 5px 6px; font: inherit; font-size: 13px; }
  .zoom { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 12.5px; color: var(--dust); }
  .zoom[hidden] { display: none; }
  .zoom input { flex: 1; accent-color: var(--sodium); }
  #readout { margin-top: 12px; font-size: 13px; color: var(--dust); min-height: 1.4em; }
  #readout b { color: var(--starlight); font-weight: 500; }

  /* Bottom instrument: date + timeline */
  #deck { position: fixed; left: 20px; right: 20px; bottom: 18px; z-index: 5; }
  #date { font-family: var(--cond); font-weight: 300; font-size: clamp(38px, 6vw, 72px); line-height: .9;
          color: var(--starlight); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  #date small { font-size: .38em; font-weight: 500; color: var(--chrono); margin-left: 12px; letter-spacing: .02em; }
  #event { font-size: 16px; color: var(--sodium); min-height: 1.5em; margin: 8px 0 10px; transition: opacity .6s; }
  .bar { display: flex; align-items: center; gap: 12px; }
  .ctl { all: unset; cursor: pointer; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
         background: var(--chrono); color: #03141a; flex: none; }
  .ctl svg { width: 16px; height: 16px; }
  #track { position: relative; flex: 1; height: 38px; }
  #track input { position: absolute; inset: 0; width: 100%; margin: 0; accent-color: var(--chrono); background: transparent; }
  #ticks { position: absolute; left: 0; right: 0; top: 4px; height: 8px; pointer-events: none; }
  #ticks i { position: absolute; width: 2px; height: 8px; background: var(--sodium); border-radius: 1px; transform: translateX(-1px); }
  #speed { flex: none; }
  .ends { display: flex; justify-content: space-between; font-family: var(--cond); font-size: 14px; color: var(--dust);
          margin: 0 0 0 50px; padding-right: 120px; }
  #credits { position: fixed; right: 20px; bottom: 4px; z-index: 5; font-size: 10px; color: #56607a; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; z-index: 10; font-family: var(--cond);
             font-size: 22px; color: var(--dust); background: var(--void); transition: opacity .8s; }

  @media (max-width: 820px) {
    #log { top: 10px; left: 10px; right: 10px; width: auto; }
    #log h1 { font-size: 22px; margin-bottom: 6px; }
    #log ol { display: flex; overflow-x: auto; border-left: 0; gap: 4px; }
    #log li button { grid-template-columns: auto; padding: 4px 8px; border-left: 0; border-bottom: 2px solid transparent; white-space: nowrap; }
    #log li button[aria-current="true"] { border-bottom-color: var(--sodium); }
    #card { top: auto; bottom: 150px; left: 10px; right: 10px; width: auto; padding: 10px 12px; }
    #card p { display: none; }
    #deck { left: 10px; right: 10px; bottom: 12px; }
    .ends { padding-right: 90px; }
  }
  @media (prefers-reduced-motion: reduce) { #event, #loading { transition: none; } }
</style>
</head>
<body>
<div id="scene" aria-label="Scène 3D"></div>
<div id="loading">Chargement des éphémérides…</div>

<nav id="log" aria-label="Missions">
  <h1>Missions en mouvement</h1>
  <ol id="list"></ol>
</nav>

<aside id="card">
  <h2 id="title"></h2>
  <p id="text"></p>
  <div class="cam">
    <div class="seg" role="group" aria-label="Caméra">
      <button id="camFixed" aria-pressed="true">Vue d'ensemble</button>
      <button id="camFollow" aria-pressed="false">Suivre</button>
    </div>
    <select id="target" aria-label="Objet suivi"></select>
  </div>
  <label class="zoom" id="zoomRow" hidden>Distance
    <input id="zoom" type="range" min="0" max="100" value="45" aria-label="Distance de la caméra à l'objet suivi">
  </label>
  <div id="readout" aria-live="polite"></div>
</aside>

<section id="deck" aria-label="Lecture">
  <div id="date"></div>
  <div id="event" aria-live="polite"></div>
  <div class="bar">
    <button class="ctl" id="play" aria-label="Lecture"></button>
    <div id="track"><div id="ticks"></div><input id="time" type="range" min="0" max="10000" value="0" aria-label="Date"></div>
    <select id="speed" aria-label="Vitesse">
      <option value="0.25">Vitesse ×¼</option><option value="0.5">Vitesse ×½</option>
      <option value="1" selected>Vitesse ×1</option><option value="2">Vitesse ×2</option><option value="4">Vitesse ×4</option>
    </select>
  </div>
  <div class="ends"><span id="t0"></span><span id="t1"></span></div>
</section>
<div id="credits">Éphémérides NASA/JPL Horizons · Textures Solar System Scope (CC BY 4.0) · ArcGIS Maps SDK for JavaScript</div>

<script>
require(["esri/Map", "esri/views/SceneView", "esri/layers/GraphicsLayer", "esri/Graphic", "esri/geometry/Point",
         "esri/geometry/Polyline", "esri/geometry/Polygon", "esri/Camera"],
(Map, SceneView, GraphicsLayer, Graphic, Point, Polyline, Polygon, Camera) => {
  const SR = { wkid: 102100 };
  const MODELS = new URL("models/", location.href).href;
  const K_HELIO = 6e6, R0 = 0.2, K_GEO = 16e6 / 450000;
  const SIZES = { "Soleil": 1.6e6, "Mercure": 150e3, "Vénus": 210e3, "Terre": 220e3, "Mars": 170e3, "Jupiter": 560e3,
                  "Saturne": 1.0e6, "Uranus": 330e3, "Neptune": 330e3, "Pluton": 110e3 };
  const EARTH_GEO = 2 * 6371 * K_GEO * 3, MOON_GEO = 2 * 1737 * K_GEO * 3;
  // per-frame settings: km -> scene metres, centre name, follow range, trail share, star shell
  const FRAMES = {
    helio:  { stars: 3.6e7, follow: [1.2e6, 2.5e7], trail: 0.12, glow: 40e3 },
    geo:    { km: K_GEO, centre: "du centre de la Terre", stars: 2.6e7, follow: [4e5, 1.4e7], trail: 0.35, glow: 25e3 },
    comete: { km: 1e4, centre: "du centre du noyau de 67P", stars: 2.4e7, follow: [3e4, 1.2e7], trail: 0.08, glow: 6e3 },
  };
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const $ = (id) => document.getElementById(id);
  const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6z" fill="currentColor"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z" fill="currentColor"/></svg>';

  const statics = new GraphicsLayer({ elevationInfo: { mode: "absolute-height" } });
  const trails = new GraphicsLayer({ elevationInfo: { mode: "absolute-height" } });
  const bodies = new GraphicsLayer({ elevationInfo: { mode: "absolute-height" } });
  const map = new Map({ layers: [statics, trails, bodies], ground: { opacity: 0, navigationConstraint: { type: "none" } } });
  const view = new SceneView({
    container: "scene", map, viewingMode: "local", spatialReference: SR, qualityProfile: "high",
    environment: { lighting: { type: "virtual", directShadowsEnabled: false },
                   background: { type: "color", color: [7, 11, 20, 1] }, starsEnabled: false, atmosphereEnabled: false },
    constraints: { collision: { enabled: false } }, ui: { components: [] },
  });
  window.__view = view;
  // keep the scene centre inside the free area between the panels
  const setPadding = () => { view.padding = innerWidth > 820 ? { left: 280, right: 360, top: 0, bottom: 170 } : { top: 90, bottom: 290, left: 0, right: 0 }; };
  setPadding(); addEventListener("resize", setPadding);

  // ------------------------------------------------------------------ helpers
  const P = (x, y, z) => new Point({ x, y, z, spatialReference: SR });
  const hex = (h, a = 1) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16), a];
  const dLog = (au) => Math.log10(1 + au / R0) * K_HELIO;
  const fmtDate = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "long", year: "numeric", timeZone: "UTC" });
  const fmtShort = new Intl.DateTimeFormat("fr-FR", { month: "short", year: "numeric", timeZone: "UTC" });
  const fmtShortDay = new Intl.DateTimeFormat("fr-FR", { day: "numeric", month: "short", year: "numeric", timeZone: "UTC" });
  const fmtTime = new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit", timeZone: "UTC" });
  const nf = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 0 });
  const nf1 = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 1 });

  function pos(o, t) {  // linear interpolation on the object's regular grid; null outside its span
    if (t < o.t0 || t > o.t1) return null;
    const k = (t - o.t0) / (o.t1 - o.t0) * (o.n - 1), i = Math.min(Math.floor(k), o.n - 2), w = k - i, a = 3 * i, b = a + 3;
    const v = o.xyz;
    return [v[a] + (v[b] - v[a]) * w, v[a + 1] + (v[b + 1] - v[a + 1]) * w, v[a + 2] + (v[b + 2] - v[a + 2]) * w];
  }
  function pathBetween(o, ta, tb, maxPts = 400) {
    const pts = [], a = Math.max(ta, o.t0), b = Math.min(tb, o.t1);
    if (b <= a) return pts;
    const n = Math.max(2, Math.min(maxPts, Math.ceil((b - a) / (o.t1 - o.t0) * o.n)));
    for (let i = 0; i <= n; i++) pts.push(pos(o, a + (b - a) * i / n));
    return pts;
  }
  const lineSym = (c, w, alpha, dash) => ({ type: "line-3d", symbolLayers: [{ type: "line", size: w, material: { color: hex(c, alpha) },
                                         ...(dash ? { pattern: { type: "style", style: "dash" } } : {}) }] });
  const glowSym = (c, width) => ({ type: "line-3d", symbolLayers: [
    { type: "path", profile: "circle", width, height: width, material: { color: hex(c, 0.35) }, cap: "round", join: "round" },
    { type: "line", size: 2, material: { color: hex(c, 1) } }] });
  const labelLayer = (text) => ({ type: "text", text, size: 11, material: { color: [232, 237, 247, 1] },
                                  halo: { color: [7, 11, 20, 1], size: 1.2 } });
  const labelOffset = { verticalOffset: { screenLength: 26, maxWorldLength: 4e6, minWorldLength: 0 },
                        callout: { type: "line", size: 0.6, color: [131, 145, 173, 1] } };

  function bodySymbol(o, frame) {
    if (o.model) {
      const h = frame === "geo" ? (o.kind === "lune" ? MOON_GEO : EARTH_GEO) : (SIZES[o.name] || 150e3);
      return { type: "point-3d", symbolLayers: [{ type: "object", resource: { href: MODELS + o.model + ".gltf" }, height: h, anchor: "center" }] };
    }
    if (o.kind === "planète") return { type: "point-3d", symbolLayers: [{ type: "object", resource: { primitive: "sphere" },
                                        height: SIZES[o.name] || 110e3, material: { color: o.colour }, anchor: "center" }] };
    return { type: "point-3d", symbolLayers: [
      { type: "icon", resource: { primitive: "circle" }, size: 22, material: { color: hex(o.colour, 0.22) } },
      { type: "icon", resource: { primitive: "circle" }, size: 8, material: { color: o.colour }, outline: { color: [255, 255, 255, 1], size: 0.8 } }] };
  }
  const labelSymbol = (o) => ({ type: "point-3d", symbolLayers: [labelLayer(o.name)], ...labelOffset });

  // ------------------------------------------------------------------ static decor
  function stars(radius, n, seed) {
    let s = seed; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
    const out = [];
    for (let i = 0; i < n; i++) {
      const u = rnd() * 2 - 1, v = rnd() * 2 * Math.PI, r = radius * (1 + rnd() * 0.25), q = Math.sqrt(1 - u * u);
      const big = rnd() > 0.93;
      out.push(new Graphic({ geometry: P(r * q * Math.cos(v), r * q * Math.sin(v), r * u),
        symbol: { type: "point-3d", symbolLayers: [{ type: "icon", resource: { primitive: "circle" }, size: big ? 3 : 1.5,
          material: { color: big ? [255, 250, 235, 1] : [200, 212, 255, 0.75] } }] } }));
    }
    return out;
  }
  function ring(r, n = 180) { const p = []; for (let i = 0; i <= n; i++) { const a = 2 * Math.PI * i / n; p.push([r * Math.cos(a), r * Math.sin(a), 0]); } return p; }

  function buildStatic(sc) {
    statics.removeAll();
    const g = [];
    if (sc.frame === "helio") {
      g.push(...stars(FRAMES.helio.stars, 1400, 7));
      g.push(new Graphic({ geometry: new Polygon({ rings: [ring(dLog(125))], hasZ: true, spatialReference: SR }),
        symbol: { type: "polygon-3d", symbolLayers: [{ type: "fill", material: { color: [70, 110, 200, 0.06] } }] } }));
      [[1, "1 UA"], [5.2, "5 UA"], [30, "30 UA"], [121, "121 UA · héliopause"]].forEach(([au, t]) => {
        const r = dLog(au);
        g.push(new Graphic({ geometry: new Polyline({ paths: [ring(r)], hasZ: true, spatialReference: SR }), symbol: lineSym("#6f7fa6", 0.8, 0.6, true) }));
        g.push(new Graphic({ geometry: P(r * 0.766, -r * 0.643, 0), symbol: { type: "point-3d", symbolLayers: [
          { type: "text", text: t, size: 9, material: { color: [131, 145, 173, 1] }, halo: { color: [7, 11, 20, 1], size: 1 } }] } }));
      });
      g.push(new Graphic({ geometry: P(0, 0, 0), symbol: { type: "point-3d", symbolLayers: [
        { type: "object", resource: { href: MODELS + "soleil.gltf" }, height: SIZES["Soleil"], anchor: "center" },
        { type: "object", resource: { primitive: "sphere" }, height: SIZES["Soleil"] * 1.7, anchor: "center",
          material: { color: [255, 180, 50, 0.2] } }] } }));
    } else if (sc.frame === "geo") {
      g.push(...stars(FRAMES.geo.stars, 1200, 11));
      g.push(new Graphic({ geometry: P(0, 0, 0), symbol: { type: "point-3d", symbolLayers: [
        { type: "object", resource: { href: MODELS + "terre.gltf" }, height: EARTH_GEO, anchor: "center" }] } }));
      g.push(new Graphic({ geometry: P(0, 0, 0), symbol: labelSymbol({ name: "Terre" }) }));
    } else {  // comet 67P: a two-lobed nucleus, about 4.1 x 2.6 km, true scale
      g.push(...stars(FRAMES.comete.stars, 1200, 23));
      const rock = [118, 112, 104, 1], km = FRAMES.comete.km;
      g.push(new Graphic({ geometry: P(0, 0, 0), symbol: { type: "point-3d", symbolLayers: [
        { type: "object", resource: { primitive: "sphere" }, width: 4.1 * km, depth: 3.3 * km, height: 1.8 * km, anchor: "center", material: { color: rock } },
        { type: "object", resource: { primitive: "sphere" }, width: 2.6 * km, depth: 2.3 * km, height: 1.8 * km, anchor: "relative",
          anchorPosition: { x: -0.95, y: 0, z: -0.15 }, material: { color: rock } }] } }));
      g.push(new Graphic({ geometry: P(0, 0, 0), symbol: labelSymbol({ name: "67P" }) }));
    }
    sc.static.forEach(s => g.push(new Graphic({ geometry: new Polyline({ paths: [chunk(s.xyz)], hasZ: true, spatialReference: SR }),
                                                symbol: lineSym(s.colour, 1, 0.45) })));
    // full path of every object, faint (the "map" of the journey)
    sc.objects.forEach(o => g.push(new Graphic({ geometry: new Polyline({ paths: [pathBetween(o, o.t0, o.t1, 1500)], hasZ: true, spatialReference: SR }),
                                                 symbol: lineSym(o.colour, o.kind === "planète" ? 1 : 1.2, o.kind === "planète" ? 0.35 : 0.3) })));
    statics.addMany(g);
  }
  const chunk = (flat) => { const p = []; for (let i = 0; i < flat.length; i += 3) p.push([flat[i], flat[i + 1], flat[i + 2]]); return p; };

  // ------------------------------------------------------------------ state
  let DATA, sc, t, playing = false, speedFactor = 1, lastFrame = 0, lastTrail = 0, mode = "fixed", followName = null;
  let bodyG = {}, labelG = {}, trailG = {}, eventIdx = -1, eventTimer = null;
  let bodiesLV = null, assignedT = null, renderedT = null;  // camera follows what is actually drawn

  function loadScenario(id) {
    sc = DATA.scenarios.find(s => s.id === id);
    document.querySelectorAll("#list button").forEach(b => b.setAttribute("aria-current", String(b.dataset.id === id)));
    $("title").textContent = sc.title; $("text").textContent = sc.text;
    $("target").innerHTML = sc.objects.map(o => `<option${o.name === sc.follow ? " selected" : ""}>${o.name}</option>`).join("");
    followName = sc.follow;
    const f = sc.frame !== "helio" || (sc.t1 - sc.t0) < 40 * 864e5 ? fmtShortDay : fmtShort;
    $("t0").textContent = f.format(sc.t0); $("t1").textContent = f.format(sc.t1);
    $("ticks").innerHTML = sc.events.map(e => `<i style="left:${(e.t - sc.t0) / (sc.t1 - sc.t0) * 100}%" title="${e.text}"></i>`).join("");
    buildStatic(sc);
    bodies.removeAll(); trails.removeAll(); bodyG = {}; labelG = {}; trailG = {};
    sc.objects.forEach(o => {
      bodyG[o.name] = new Graphic({ geometry: P(0, 0, 0), symbol: bodySymbol(o, sc.frame) });
      labelG[o.name] = new Graphic({ geometry: P(0, 0, 0), symbol: labelSymbol(o) });
      bodies.addMany([bodyG[o.name], labelG[o.name]]);
      if (o.kind !== "planète" && o.kind !== "lune") {
        trailG[o.name] = new Graphic({ symbol: glowSym(o.colour, FRAMES[sc.frame].glow) });
        trails.add(trailG[o.name]);
      }
    });
    t = sc.t0; eventIdx = -1; $("event").textContent = "";
    setMode("fixed", true);
    update(true);
    setPlaying(!reduced);
  }

  function overviewCamera() {
    let m = 0;
    sc.objects.forEach(o => { for (let i = 0; i < o.xyz.length; i += 3 * 20) m = Math.max(m, Math.hypot(o.xyz[i], o.xyz[i + 1])); });
    if (sc.frame === "helio") m = Math.max(m, dLog(6));
    const d = m * 3.0, tilt = 58;
    return new Camera({ position: P(0, -d * Math.sin(tilt * Math.PI / 180), d * Math.cos(tilt * Math.PI / 180)), heading: 0, tilt });
  }
  function followDistance() {
    const z = +$("zoom").value / 100;  // 0 close .. 1 far
    const [near, far] = FRAMES[sc.frame].follow;
    return near * Math.pow(far / near, z);
  }
  let followHeading = 0;
  function followCamera(p) {
    const d = followDistance(), tilt = 62, h = followHeading * Math.PI / 180, tr = tilt * Math.PI / 180;
    return new Camera({ position: P(p[0] - d * Math.sin(tr) * Math.sin(h), p[1] - d * Math.sin(tr) * Math.cos(h), p[2] + d * Math.cos(tr)),
                        heading: followHeading, tilt });
  }
  function setMode(m, instant) {
    mode = m;
    $("camFixed").setAttribute("aria-pressed", String(m === "fixed"));
    $("camFollow").setAttribute("aria-pressed", String(m === "follow"));
    $("zoomRow").hidden = m !== "follow";
    view.navigation.mouseWheelZoomEnabled = m === "fixed"; view.navigation.browserTouchPanEnabled = m === "fixed";
    const o = sc.objects.find(x => x.name === followName);
    if (m === "follow") followHeading = view.camera ? view.camera.heading : 0;
    const cam = m === "fixed" ? overviewCamera() : followCamera(pos(o, t) || pos(o, o.t0));
    transitioning = true;
    view.goTo(cam, { animate: !instant && !reduced, duration: 1400 }).catch(() => {}).then(() => { transitioning = false; });
  }
  let transitioning = false;

  // ------------------------------------------------------------------ frame update
  function update(forceTrail) {
    if (forceTrail || !bodiesLV || !bodiesLV.updating) {
      renderedT = assignedT ?? t; assignedT = t;
      sc.objects.forEach(o => {
        const p = pos(o, t), vis = !!p;
        bodyG[o.name].visible = labelG[o.name].visible = vis;
        if (vis) { const g = P(p[0], p[1], p[2]); bodyG[o.name].geometry = g; labelG[o.name].geometry = g; }
      });
      if (forceTrail) renderedT = t;
    }
    const now = performance.now();
    if (forceTrail || now - lastTrail > 90) {
      lastTrail = now;
      const span = (sc.t1 - sc.t0) * FRAMES[sc.frame].trail;
      Object.entries(trailG).forEach(([name, g]) => {
        const o = sc.objects.find(x => x.name === name), pts = pathBetween(o, t - span, t, 160);
        g.geometry = pts.length > 1 ? new Polyline({ paths: [pts], hasZ: true, spatialReference: SR }) : null;
      });
    }
    if (mode === "follow" && !transitioning) {
      const o = sc.objects.find(x => x.name === followName), p = pos(o, renderedT ?? t);
      if (p) view.camera = followCamera(p);
    }
    // date, readout, events
    const d = new Date(t);
    $("date").innerHTML = fmtDate.format(d) + (sc.frame !== "helio" ? `<small>${fmtTime.format(d)} UTC</small>` : "");
    $("time").value = Math.round((t - sc.t0) / (sc.t1 - sc.t0) * 10000);
    const o = sc.objects.find(x => x.name === followName), p = o && pos(o, t);
    if (p) {
      const r = Math.hypot(p[0], p[1], p[2]);
      $("readout").innerHTML = sc.frame === "helio"
        ? `<b>${o.name}</b> à ${nf1.format(R0 * (Math.pow(10, r / K_HELIO) - 1))} UA du Soleil`
        : `<b>${o.name}</b> à ${nf.format(r / FRAMES[sc.frame].km)} km ${FRAMES[sc.frame].centre}`;
    } else $("readout").textContent = o ? `${o.name} n'est pas encore parti` : "";
    let idx = -1; sc.events.forEach((e, i) => { if (e.t <= t) idx = i; });
    if (idx !== eventIdx) {
      eventIdx = idx;
      if (idx >= 0 && t - sc.events[idx].t < (sc.t1 - sc.t0) * 0.06) {
        $("event").textContent = sc.events[idx].text; $("event").style.opacity = 1;
        clearTimeout(eventTimer); eventTimer = setTimeout(() => ($("event").style.opacity = 0), 4500);
      }
    }
  }

  function frame(ts) {
    if (playing) {
      const dt = Math.min(0.1, (ts - (lastFrame || ts)) / 1000);
      t += dt * sc.speed * 1000 * speedFactor;
      if (t >= sc.t1) { t = sc.t1; setPlaying(false); }
      update();
    }
    lastFrame = ts;
    requestAnimationFrame(frame);
  }
  function setPlaying(v) {
    playing = v;
    if (v && t >= sc.t1) t = sc.t0;
    $("play").innerHTML = v ? ICON_PAUSE : ICON_PLAY;
    $("play").setAttribute("aria-label", v ? "Pause" : "Lecture");
  }

  // ------------------------------------------------------------------ UI wiring
  $("play").onclick = () => setPlaying(!playing);
  $("speed").onchange = (e) => (speedFactor = +e.target.value);
  $("time").oninput = (e) => { t = sc.t0 + (sc.t1 - sc.t0) * e.target.value / 10000; update(true); };
  $("camFixed").onclick = () => setMode("fixed");
  $("camFollow").onclick = () => setMode("follow");
  $("target").onchange = (e) => { followName = e.target.value; if (mode === "follow") setMode("follow"); update(true); };
  $("zoom").oninput = () => update();
  view.on("drag", (e) => {  // in follow mode, dragging turns around the followed object
    if (mode !== "follow") return;
    e.stopPropagation();
    if (e.action === "update") { followHeading = (followHeading - (e.x - (view.__lx ?? e.x)) * 0.3 + 360) % 360; update(); }
    view.__lx = e.action === "end" ? undefined : e.x;
  });
  view.on("mouse-wheel", (e) => { if (mode !== "follow") return; e.stopPropagation();
    $("zoom").value = Math.max(0, Math.min(100, +$("zoom").value + (e.deltaY > 0 ? 3 : -3))); update(); });
  addEventListener("keydown", (e) => { if (e.code === "Space" && e.target.tagName !== "BUTTON" && e.target.tagName !== "SELECT") { e.preventDefault(); setPlaying(!playing); } });

  fetch("animations.json").then(r => r.json()).then(data => {
    DATA = data;
    $("list").innerHTML = data.scenarios.map(s =>
      `<li><button data-id="${s.id}"><span class="y">${s.year}</span><span>${s.title}</span></button></li>`).join("");
    document.querySelectorAll("#list button").forEach(b => (b.onclick = () => loadScenario(b.dataset.id)));
    view.when(async () => {
      bodiesLV = await view.whenLayerView(bodies);
      const first = new URLSearchParams(location.search).get("s") || "voyager";
      loadScenario(data.scenarios.some(s => s.id === first) ? first : data.scenarios[0].id);
      $("loading").style.opacity = 0; setTimeout(() => $("loading").remove(), 900);
      requestAnimationFrame(frame);
    });
  });
});
</script>
</body>
</html>
